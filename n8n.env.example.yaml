# Settings for n8n on Cloud Run (see DEPLOY.md, "n8n in the cloud"). Copy to n8n.env.yaml, which git ignores,
# fill in the XXXX parts, and deploy with --env-vars-file n8n.env.yaml. Format: NAME: "value".

# n8n's own data (workflows, Google sign-ins, execution log) is kept in your Supabase database, in a separate
# "n8n" schema, so nothing is lost when Cloud Run shuts the server down. Same pooler host, user and password as
# DATABASE_URL in .env.
DB_TYPE: "postgresdb"
DB_POSTGRESDB_HOST: "aws-1-us-west-2.pooler.supabase.com"
DB_POSTGRESDB_PORT: "5432"
DB_POSTGRESDB_DATABASE: "postgres"
DB_POSTGRESDB_USER: "postgres.XXXX"
DB_POSTGRESDB_PASSWORD: "XXXX"
DB_POSTGRESDB_SCHEMA: "n8n"
DB_POSTGRESDB_SSL_ENABLED: "true"
DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"

# Encrypts the Google sign-ins stored in the database. Make one long random value and never change it:
# with a different key n8n can't read its saved credentials.
N8N_ENCRYPTION_KEY: "XXXX"

# The service's public address: https://n8n-<project number>.<region>.run.app
N8N_HOST: "n8n-XXXX.us-west1.run.app"
N8N_PROTOCOL: "https"
N8N_PORT: "5678"
N8N_EDITOR_BASE_URL: "https://n8n-XXXX.us-west1.run.app"
N8N_WEBHOOK_URL: "https://n8n-XXXX.us-west1.run.app"
N8N_PROXY_HOPS: "1"
N8N_ENDPOINT_HEALTH: "health"
GENERIC_TIMEZONE: "America/New_York"
N8N_DIAGNOSTICS_ENABLED: "false"
