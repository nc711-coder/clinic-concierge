# Settings for the live demo on Cloud Run. Copy this file to deploy.env.yaml (which git and gcloud ignore),
# fill in the two secrets, and deploy with --env-vars-file deploy.env.yaml. Every value must be in quotes,
# written as  NAME: "value"  (a colon and a space, not =).

DATABASE_URL: "postgresql://postgres.YOUR-PROJECT-REF:YOUR-PASSWORD@aws-0-us-east-1.pooler.supabase.com:5432/postgres"
GROQ_API_KEY: "gsk_..."

# Groq paid Developer plan: about a tenth of a cent per message, answers in a second or two.
LLM_PROVIDER: "groq"
GROQ_MODEL: "openai/gpt-oss-120b"
GROQ_REASONING_EFFORT: "low"
GROQ_FALLBACK_MODEL: "openai/gpt-oss-20b"   # answers if the main model stalls or hits a limit

# Alternative: Google Gemini (free tier is only ~20 requests a day per model; fine with billing turned on).
# LLM_PROVIDER: "gemini"
# GEMINI_API_KEY: "AIza..."
# GEMINI_MODEL: "gemini-3.5-flash"

EMBEDDER: "local"
RERANKER: "local"
CHAT_MIN_RERANK_SCORE: "-8.78"

# Public demo limits: per visitor per hour, and for everyone per day. They cap what strangers can spend:
# 300 messages a day is roughly 30-40 cents on Groq's paid tier.
MESSAGES_PER_HOUR_PER_VISITOR: "40"
MESSAGES_PER_DAY: "300"

# Staff notifications: the n8n webhook (see DEPLOY.md, "n8n in the cloud"). The secret must match n8n's
# Header Auth credential.
# EVENT_WEBHOOK_URL: "https://n8n-XXXX.us-west1.run.app/webhook/clinic-events"
# EVENT_WEBHOOK_SECRET: "XXXX"
# ALERT_EVERY_MINUTES: "30"      # failure emails: at most one per kind of problem in this window
